# mavlink-router config for the megadrone Pi.
# Install on the Pi at: /etc/mavlink-router/main.conf

[General]
# Mission Planner / QGroundControl / scripts connect here over TCP
TcpServerPort = 5760

[UartEndpoint flight_controller]
# Pi GPIO UART, wired to the FC's TELEM2 (SERIAL2: MAVLink2 @ 115200)
Device = /dev/ttyAMA0
Baud = 115200

[UdpEndpoint local_scripts]
Mode = Normal
Address = 127.0.0.1
Port = 14551
